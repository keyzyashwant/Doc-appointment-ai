[project]
name = "doctor-appointment-ai"
version = "0.1.0"
description = "Backend for the doctor appointment voice desk"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32.0",
    "pipecat-ai[google,elevenlabs,webrtc,silero]>=0.0.56",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
